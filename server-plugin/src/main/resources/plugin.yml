name: PveAuction
version: ${version}
main: dev.narek.pveauction.PveAuctionPlugin
api-version: "1.21"
description: PvE аукцион — GUI и SQLite
authors: [narek]
softdepend: [Vault, FastAsyncWorldEdit, WorldEdit]

commands:
  ah:
    description: Аукцион
    usage: /ah [sell <цена>]
  admin:
    description: Админка сервера
    usage: /admin [give <ник> <сумма>]
  rtp:
    description: Телепорт в мир RTP
    usage: /rtp
  spawn:
    description: Вернуться на спавн
    usage: /spawn
  sethome:
    description: Установить дом
    usage: /sethome
  home:
    description: Телепорт домой
    usage: /home
  pay:
    description: Перевод денег
    usage: /pay <ник> <сумма>
  clan:
    description: Кланы
    usage: /clan <подкоманда>
  shop:
    description: Магазин и скупка
    usage: /shop
  givesilver:
    description: Выдать серебро (валюта торгаша)
    usage: /givesilver give <ник> <кол-во>
  tpa:
    description: Запрос телепорта к игроку (не путать с Essentials /tp)
    usage: /tpa <ник>
    aliases: [tpreq]
  tpaccept:
    description: Принять запрос телепорта
    usage: /tpaccept
  tpdeny:
    description: Отклонить запрос телепорта
    usage: /tpdeny
  donate:
    description: Выдача донатов
    usage: /donate give <ник> <донат> <дней|forever>
  register:
    description: Регистрация пароля
    usage: /reg <пароль>
    aliases: [reg]
  login:
    description: Вход по паролю
    usage: /login <пароль>
    aliases: [l]
  apriv:
    description: Управление админ-приватами
    usage: /apriv <sethome|home|interact|delete|list|info|clear>
  claim:
    description: Создать админ-приват по выделению
    usage: /claim <название>
  wand:
    description: Топор выделения (как //wand)
    usage: /wand
  expand:
    description: Расширить выделение вверх/вниз
    usage: /expand <число> up|down

permissions:
  pveauction.auth.bypass:
    description: Пропуск /reg и /login (тесты, модераторы)
    default: false
  pveauction.use:
    description: Аукцион и продажа
    default: true
  pveauction.worldedit:
    description: WorldEdit / FAWE (//set, //copy, …)
    default: op
    children:
      worldedit.*: true
  pveauction.admin:
    description: Админка — креатив, выдача денег
    default: op
    children:
      pveauction.worldedit: true
  pveauction.apriv:
    description: Админ-приваты — топор, create/delete, строить в зонах
    default: op
  pveauction.apriv.unlimited:
    description: Без лимита числа приватов (при max-regions-per-player > 0)
    default: op
  pveauction.travel.rtp:
    description: Команда /rtp
    default: true
  pveauction.travel.spawn:
    description: Команда /spawn
    default: true
  pveauction.spawn.bypass:
    description: Строить и бить на спавне
    default: op
  pveauction.home:
    description: /sethome и /home
    default: true
  pveauction.pay:
    description: /pay
    default: true
  pveauction.clan:
    description: Команды клана
    default: true
  pveauction.shop:
    description: /shop
    default: true
  pveauction.tpa:
    description: /tpa — запрос телепорта к игроку
    default: true
  pveauction.donate.admin:
    description: /donate — выдача донатов
    default: op

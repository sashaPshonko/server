# Макс. активных лотов на одного игрока
max-active-lots: 5

# Перевыставить в хранилище (секунды)
relist-cooldown-seconds: 60

# --- Миры: спавн (карта) и RTP (обычный выживание 1000×1000) ---
spawn-world: world
rtp-world: rtp
rtp-world-size: 1000

# Случайный RTP: отступ от границы мира и попыток найти землю
rtp-border-margin: 40
rtp-max-attempts: 40

# При входе — на спавн
teleport-to-spawn-on-join: true

# Спавн: /spawn и вход
spawn-location:
  world: world
  x: 8.5
  y: -58
  z: 8.5
  yaw: 0
  pitch: 0

# Яма/портал на карте спавна → случайный RTP (как /rtp)
spawn-portal:
  x: 8
  y: -62
  z: -19
  radius: 2.5
# Игрок в зоне портала и не выше этой высоты (упал в яму)
spawn-portal-max-y: -60
spawn-portal-cooldown-ticks: 60

# /rtp только с карты спавна
rtp-only-from-spawn-world: true
